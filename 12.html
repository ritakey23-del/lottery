<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💎 祭品文抽獎系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --pearl-aqua: #79E2D0;
      --pearl-aqua-dark: #3BBFA8;
      --pearl-aqua-glow: rgba(121, 226, 208, 0.35);
    }
    .text-aqua { color: var(--pearl-aqua); }
    .bg-aqua { background-color: var(--pearl-aqua); }
    .border-aqua { border-color: var(--pearl-aqua); }
    .glow-aqua {
      box-shadow: 0 0 25px var(--pearl-aqua-glow);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
  <script>
  (function() {
    const MY_SECRET = "2026"; // 👈 在這裡設定你自己的專屬密碼
    
    // 檢查本次分頁是否已經輸入過密碼（避免重新整理一直跳）
    if (sessionStorage.getItem("auth_pass") !== "true") {
      const input = prompt("💎 請輸入存取金鑰：");
      if (input === MY_SECRET) {
        sessionStorage.setItem("auth_pass", "true");
      } else {
        alert("密碼錯誤，拒絕存取！");
        document.body.innerHTML = "<h2 style='color:#fff;text-align:center;margin-top:20%'>🔒 Access Denied</h2>";
        window.stop();
      }
    }
  })();
</script>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 md:p-8 font-sans selection:bg-[#79E2D0] selection:text-slate-900">

  <!-- Header -->
  <header class="text-center mb-8 max-w-xl">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-teal-500/30 bg-teal-950/40 text-aqua text-xs font-semibold mb-3">
      <span>💎 祭品兌現中</span> • <span>Pearl Aqua Lucky Draw</span>
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-wide flex items-center justify-center gap-2">
      祭品文開獎面板
    </h1>
    <p class="text-xs text-slate-400 mt-2">支援 Threads (一人一籤) 與 Instagram (可重複留言需標記不同人) 自動驗證去重</p>
  </header>

  <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側面板：控制與設定區 (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-5">
      
      <!-- 檔案與平台設定 -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-md">
        <h2 class="text-sm font-semibold text-aqua mb-3 flex items-center gap-2">
          <span>📁 資料來源設定</span>
        </h2>
        
        <div class="mb-4">
          <label class="block text-xs text-slate-400 mb-1">上傳留言 JSON 檔：</label>
          <input type="file" id="fileInput" accept=".json" class="block w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-500/20 file:text-aqua hover:file:bg-teal-500/30 cursor-pointer border border-slate-700 rounded-xl bg-slate-800/60 p-1"/>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">抽獎模式：</label>
            <select id="platformMode" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-aqua">
              <option value="threads">Threads (帳號去重/一人一籤)</option>
              <option value="instagram" selected>Instagram (需標記不同好友)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">IG 最少標記好友數：</label>
            <input type="number" id="minMentions" value="1" min="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-aqua">
          </div>
        </div>

        <div class="flex items-center justify-between p-2.5 bg-slate-950/60 rounded-xl border border-slate-800 text-xs">
          <span class="text-slate-400">目前有效抽獎籤數：</span>
          <span id="ticketCountBadge" class="font-bold text-aqua text-sm">0 張籤</span>
        </div>
      </div>

      <!-- 開獎設定 -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-md">
        <h2 class="text-sm font-semibold text-aqua mb-3 flex items-center gap-2">
          <span>🎯 本次抽取設定</span>
        </h2>

        <div class="mb-3">
          <label class="block text-xs text-slate-400 mb-1">抽取獎項名稱：</label>
          <input type="text" id="prizeName" value="2025 Keyland 入場帽子" placeholder="例如：娃包、風扇、蕾絲御守..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-aqua font-medium">
          
          <!-- 快捷填入標籤 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" onclick="setPrize('2025 Keyland 入場帽子', 1)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">帽子 x1</button>
            <button type="button" onclick="setPrize('2025 Keyland 娃包', 1)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">娃包 x1</button>
            <button type="button" onclick="setPrize('2026 SHINee 八巡 入場風扇', 1)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">風扇 x1</button>
            <button type="button" onclick="setPrize('3coins × 車折神社 蕾絲御守', 3)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md border border-slate-700">御守 x3</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">抽取名額 (位)：</label>
            <input type="number" id="drawCount" value="1" min="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-aqua">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">留言關鍵字過濾 (選填)：</label>
            <input type="text" id="filterKeyword" placeholder="如 #帽子 或 歌曲名" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-aqua">
          </div>
        </div>

        <div class="flex items-center gap-2 mb-4">
          <input type="checkbox" id="excludePrevWinners" checked class="rounded bg-slate-800 border-slate-700 text-teal-500 focus:ring-0 cursor-pointer">
          <label for="excludePrevWinners" class="text-xs text-slate-300 cursor-pointer select-none">排除先前已中獎帳號（避免一人全包大獎）</label>
        </div>

        <button id="startDrawBtn" class="w-full py-3.5 bg-gradient-to-r from-teal-400 to-[#3BBFA8] text-slate-950 font-bold rounded-xl transition duration-200 hover:opacity-95 active:scale-[0.99] glow-aqua text-sm flex items-center justify-center gap-2 shadow-lg">
          <span>🎉 開始隨機抽出</span>
        </button>
      </div>
    </section>

    <!-- 右側面板：開獎展示與得獎名單區 (7 cols) -->
    <section class="lg:col-span-7 flex flex-col gap-5">
      
      <!-- 動態大螢幕（抽 1 人巨幕 / 抽多人網格展示） -->
      <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden min-h-[300px] flex flex-col">
        <div class="absolute -top-12 -right-12 w-40 h-40 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="flex items-center justify-between pb-3 border-b border-slate-800/80 mb-4">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
            即時開獎大舞台
          </span>
          <span id="currentPrizeBadge" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-teal-950/80 text-aqua border border-teal-500/30">
            等待開獎
          </span>
        </div>

        <!-- 開獎展示容器（預設等待狀態） -->
        <div id="stageContainer" class="flex-1 flex flex-col items-center justify-center py-4">
          <div class="text-slate-600 text-5xl mb-2">💎</div>
          <p class="text-slate-400 text-sm">請於左側載入資料並按下「開始隨機抽出」</p>
        </div>
      </div>

      <!-- 歷次開獎得獎紀錄 (中獎清冊) -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
            <span>🏆 得獎清冊總結</span>
            <span id="winnerBadge" class="text-[11px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-normal">共 0 位</span>
          </h2>
          <div class="flex gap-2">
            <button onclick="copyAnnouncement()" class="text-xs text-aqua hover:underline px-2 py-1 bg-slate-800/80 rounded-lg border border-slate-700">複製公告文案</button>
            <button onclick="clearHistory()" class="text-xs text-rose-400 hover:underline px-2 py-1 bg-slate-800/80 rounded-lg border border-slate-700">重設紀錄</button>
          </div>
        </div>

        <div id="winnersHistoryList" class="flex-1 overflow-y-auto max-h-[320px] custom-scroll space-y-2.5 pr-1">
          <p class="text-xs text-slate-500 text-center py-8">尚無開獎紀錄</p>
        </div>
      </div>

    </section>

  </main>

  <script>
    let rawComments = [];
    let validTickets = [];
    let winnersHistory = []; // { prize, user, text, mentions, timestamp }

    // 設定捷徑獎項
    function setPrize(name, count) {
      document.getElementById('prizeName').value = name;
      document.getElementById('drawCount').value = count;
    }

    // 檔案讀取
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          rawComments = JSON.parse(evt.target.result);
          buildPool();
        } catch (err) {
          alert('JSON 解析失敗，請確認檔案格式是否正確！');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('platformMode').addEventListener('change', buildPool);
    document.getElementById('minMentions').addEventListener('input', buildPool);

    // 依模式計算籤池
    function buildPool() {
      if (!rawComments || rawComments.length === 0) return;
      const mode = document.getElementById('platformMode').value;
      const minMentions = parseInt(document.getElementById('minMentions').value, 10) || 0;

      validTickets = [];

      if (mode === 'threads') {
        // Threads：一人一籤，過濾空帳號
        const seen = new Set();
        rawComments.forEach(item => {
          const user = (item.username || '').trim();
          if (user && !seen.has(user)) {
            seen.add(user);
            validTickets.push({
              username: user,
              text: item.text || '',
              mentions: item.mentions || []
            });
          }
        });
      } else {
        // Instagram：可重複留言，但必須標記不同好友
        const userTaggedHistory = new Map();
        rawComments.forEach(comment => {
          const user = (comment.username || '').trim();
          if (!user) return; // 略過空白帳號

          const mentions = (comment.mentions || []).filter(m => m && m.toLowerCase() !== user.toLowerCase());

          if (!userTaggedHistory.has(user)) {
            userTaggedHistory.set(user, new Set());
          }
          const history = userTaggedHistory.get(user);
          const newMentions = mentions.filter(m => !history.has(m));

          if (newMentions.length >= minMentions) {
            newMentions.forEach(m => history.add(m));
            validTickets.push({
              username: user,
              text: comment.text || '',
              validMentions: newMentions
            });
          }
        });
      }

      document.getElementById('ticketCountBadge').innerText = `${validTickets.length} 張有效籤`;
    }

    // 開始抽獎
    document.getElementById('startDrawBtn').addEventListener('click', function() {
      if (validTickets.length === 0) return alert('籤池目前沒有有效名單，請先上傳 JSON 檔！');

      const prize = document.getElementById('prizeName').value.trim() || '神秘大獎';
      const count = parseInt(document.getElementById('drawCount').value, 10) || 1;
      const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();
      const excludePrev = document.getElementById('excludePrevWinners').checked;

      // 篩選籤池
      let pool = [...validTickets];

      if (excludePrev && winnersHistory.length > 0) {
        const prevUsers = new Set(winnersHistory.map(w => w.username));
        pool = pool.filter(ticket => !prevUsers.has(ticket.username));
      }

      if (keyword) {
        pool = pool.filter(ticket => ticket.text && ticket.text.toLowerCase().includes(keyword));
      }

      if (pool.length === 0) {
        return alert('在目前的條件篩選下，沒有符合資格的候選者！');
      }

      // 洗牌
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      // 取出不重複帳號的得獎者
      const chosenWinners = [];
      const chosenUsers = new Set();

      for (const ticket of pool) {
        if (!chosenUsers.has(ticket.username)) {
          chosenWinners.push(ticket);
          chosenUsers.add(ticket.username);
          if (chosenWinners.length >= count) break;
        }
      }

      // 執行開獎動畫與畫面呈現
      runAnimationAndDisplay(prize, chosenWinners);
    });

    // 抽獎展示（支援 1 人巨幕 與 多人網格展示）
    function runAnimationAndDisplay(prize, winners) {
      document.getElementById('currentPrizeBadge').innerText = prize;
      const stage = document.getElementById('stageContainer');

      // 滾動動畫效果
      let counter = 0;
      const interval = setInterval(() => {
        stage.innerHTML = `
          <div class="text-center py-8 animate-pulse">
            <span class="text-xs text-aqua tracking-widest font-mono">LUCKY DRAW RUNNING...</span>
            <div class="text-2xl md:text-3xl font-black text-slate-300 mt-2">
              🎲 @${validTickets[Math.floor(Math.random() * validTickets.length)].username}
            </div>
          </div>
        `;
        counter++;
        if (counter > 15) {
          clearInterval(interval);
          renderStageWinners(prize, winners);
        }
      }, 70);
    }

    // 渲染上方大舞台得獎者
    function renderStageWinners(prize, winners) {
      const stage = document.getElementById('stageContainer');
      
      // 慶祝彩帶
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#79E2D0', '#3BBFA8', '#ffffff', '#FFD700']
      });

      if (winners.length === 1) {
        // 單人巨幕
        const w = winners[0];
        stage.innerHTML = `
          <div class="text-center w-full px-2 py-4">
            <span class="text-xs px-3 py-1 bg-teal-500/20 text-aqua rounded-full font-semibold border border-teal-500/30">CONGRATULATIONS!</span>
            <h3 class="text-3xl md:text-4xl font-extrabold text-aqua mt-3 break-all tracking-wide">
              @${w.username}
            </h3>
            <div class="mt-4 max-w-lg mx-auto bg-slate-800/80 border border-slate-700/80 p-3 rounded-xl text-left text-xs text-slate-300 shadow-inner">
              <span class="text-slate-400 block mb-1">💬 得獎留言：</span>
              <p class="break-words line-clamp-3">${w.text || '(無內文)'}</p>
              ${w.validMentions && w.validMentions.length ? `<span class="mt-2 block text-teal-400 font-mono text-[11px]">標記好友：@${w.validMentions.join(' @')}</span>` : ''}
            </div>
          </div>
        `;
      } else {
        // 多人網格展示
        const cardsHtml = winners.map((w, idx) => `
          <div class="bg-slate-850 bg-slate-800/70 border border-slate-700/90 rounded-xl p-3 flex flex-col justify-between shadow-md">
            <div>
              <div class="flex items-center justify-between gap-1 mb-1.5">
                <span class="text-xs font-bold text-aqua break-all">#${idx + 1} @${w.username}</span>
                <span class="text-[10px] text-teal-300/80 font-mono">WINNER</span>
              </div>
              <p class="text-[11px] text-slate-300 line-clamp-2 bg-slate-900/60 p-2 rounded border border-slate-800/80">
                ${w.text || '(無內文)'}
              </p>
            </div>
            ${w.validMentions && w.validMentions.length ? `<span class="mt-1.5 block text-teal-400 font-mono text-[10px] truncate">@${w.validMentions.join(' @')}</span>` : ''}
          </div>
        `).join('');

        stage.innerHTML = `
          <div class="w-full">
            <div class="text-center mb-3">
              <span class="text-xs px-3 py-0.5 bg-teal-500/20 text-aqua rounded-full font-semibold border border-teal-500/30">
                恭喜以下 ${winners.length} 位幸運兒獲得【${prize}】！
              </span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-[220px] overflow-y-auto custom-scroll pr-1">
              ${cardsHtml}
            </div>
          </div>
        `;
      }

      // 寫入下方歷史清冊
      winners.forEach(w => {
        winnersHistory.unshift({
          prize: prize,
          username: w.username,
          text: w.text || '',
          validMentions: w.validMentions || [],
          timestamp: new Date().toLocaleTimeString()
        });
      });

      renderHistory();
    }

    // 渲染下方中獎清冊
    function renderHistory() {
      const listEl = document.getElementById('winnersHistoryList');
      document.getElementById('winnerBadge').innerText = `共 ${winnersHistory.length} 位`;

      if (winnersHistory.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">尚無開獎紀錄</p>`;
        return;
      }

      listEl.innerHTML = winnersHistory.map((item, index) => `
        <div class="p-3 bg-slate-800/60 border border-slate-700/60 rounded-xl flex items-start justify-between gap-3 text-xs">
          <div class="space-y-1 flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="px-2 py-0.5 bg-teal-950 text-aqua border border-teal-500/30 rounded font-medium text-[11px]">${item.prize}</span>
              <span class="font-bold text-white">@${item.username}</span>
              <span class="text-[10px] text-slate-500 font-mono">${item.timestamp}</span>
            </div>
            <p class="text-slate-300 text-[11px] break-words truncate">${item.text}</p>
          </div>
          <button onclick="removeHistoryItem(${index})" class="text-slate-500 hover:text-rose-400 p-1">✕</button>
        </div>
      `).join('');
    }

    function removeHistoryItem(index) {
      winnersHistory.splice(index, 1);
      renderHistory();
    }

    function clearHistory() {
      if (confirm('確定要清空所有得獎名單與紀錄嗎？')) {
        winnersHistory = [];
        renderHistory();
        document.getElementById('stageContainer').innerHTML = `
          <div class="text-slate-600 text-5xl mb-2">💎</div>
          <p class="text-slate-400 text-sm">請於左側設定並按下「開始隨機抽出」</p>
        `;
        document.getElementById('currentPrizeBadge').innerText = '等待開獎';
      }
    }

    // 一鍵複製公告文案
    function copyAnnouncement() {
      if (winnersHistory.length === 0) return alert('目前尚無中獎名單可複製！');

      const byPrize = {};
      winnersHistory.forEach(item => {
        if (!byPrize[item.prize]) byPrize[item.prize] = [];
        byPrize[item.prize].push(item.username);
      });

      let text = `💎【SHINee 祭品文得獎名單公布】💎\n\n感謝大家一起集氣！以下為各品項幸運得主：\n`;
      for (const [p, users] of Object.entries(byPrize)) {
        text += `\n🎁 ${p}：\n` + users.map(u => `@${u}`).join('\n') + `\n`;
      }
      text += `\n📌 請以上得獎者於 48 小時內私訊寄送資訊，逾期視同放棄。再次感謝大家！🩵`;

      navigator.clipboard.writeText(text).then(() => {
        alert('得獎名單文案已複製到剪貼簿，可直接貼到貼文留言公布！');
      });
    }
  </script>
</body>
</html>
