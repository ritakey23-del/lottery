<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢想音樂節 - 3D 坐席視野模擬器</title>
    <!-- 引入 Three.js 與 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 400px; background: #1a1a1a; padding: 20px; overflow-y: auto; border-right: 1px solid #333; z-index: 10; display: flex; flex-direction: column; gap: 15px; }
        .viewport-3d { flex: 1; position: relative; background: #050505; }
        #canvas3d { width: 100%; height: 100%; display: block; }

        .hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 12px 18px; border-radius: 8px; font-size: 13px; line-height: 1.5; pointer-events: none; border: 1px solid #444; }
        .fov-toggle { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 8px; }
        .fov-btn { background: rgba(30,30,30,0.85); color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .fov-btn:hover { background: #444; }

        h2 { margin: 0; font-size: 20px; }
        .subtitle { font-size: 13px; color: #f39c12; margin-top: 5px; }
        .box { background: #242424; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .input-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        input[type="number"], select { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; font-size: 14px; }
        input[type="number"] { width: 75px; text-align: center; }
        button.action-btn { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button.action-btn:hover { background: #45a049; }

        .result-card { padding: 12px; border-radius: 6px; background: #2e2e2e; margin-top: 10px; border-left: 4px solid #00BFFF; }
        .score-display { font-size: 20px; font-weight: bold; margin: 6px 0; }
        .final-rank { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #000; margin-bottom: 8px; }
        .advice-item { display: block; font-size: 12px; color: #ccc; margin-top: 4px; }

        @media (max-width: 900px) {
            .app-container { flex-direction: column-reverse; height: auto; }
            .sidebar { width: 100%; height: auto; }
            .viewport-3d { height: 60vh; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 控制側邊欄 -->
    <div class="sidebar">
        <div>
            <h2>夢想音樂節 - 3D 坐席視野</h2>
            <div class="subtitle">全坐席視角模擬・大螢幕轉播・偶像舞台</div>
        </div>

        <div class="box">
            <div class="input-group">
                <label>觀看姿勢</label>
                <select id="postureSelect" onchange="applySeatView()">
                    <option value="sit" selected>🪑 坐姿 (預設椅高)</option>
                    <option value="stand">🧍 站姿 (站立嗨唱)</option>
                </select>
            </div>
            <div class="input-group">
                <label>身高校正</label>
                <div>
                    <input type="number" id="viewerHeight" value="165" min="130" max="210"> cm
                </div>
            </div>
            <div class="input-group">
                <label>選擇排法模式</label>
                <select id="layoutSelect" onchange="buildSeatCloud()">
                    <option value="decreasing">遞減排法</option>
                    <option value="10x10">10x10 排法</option>
                </select>
            </div>
            <div class="input-group">
                <label>查詢座位</label>
                <div>
                    第 <input type="number" id="rowA" value="8" min="1" max="43"> 排
                    <input type="number" id="seatA" value="51" min="1" max="108"> 號
                </div>
            </div>
            <button class="action-btn" onclick="applySeatView()">切換至該座位 3D 視角</button>
        </div>

        <div id="resultBox" class="result-card" style="display: none;"></div>
        
        <div style="font-size: 12px; color: #777; line-height: 1.5;">
            💡 操作提示：點擊右側畫面<b>拖曳旋轉</b>角度，<b>滾輪</b>可放大縮小。切換後會顯示前排坐姿觀眾與大螢幕視野。
        </div>
    </div>

    <!-- 3D 畫布與 HUD -->
    <div class="viewport-3d" id="viewport">
        <canvas id="canvas3d"></canvas>
        <div class="hud-overlay" id="hudInfo">
            目前視角：全場俯瞰預覽<br>
            請於左側輸入座位排號並點擊切換
        </div>
        <div class="fov-toggle">
            <button class="fov-btn" onclick="setFOV(70)">1× 主鏡頭</button>
            <button class="fov-btn" onclick="setFOV(95)">0.5× 超廣角</button>
            <button class="fov-btn" onclick="resetToOverview()">全場俯瞰</button>
        </div>
    </div>
</div>

<script>
    const totalRows = 43;
    let scene, camera, renderer, controls;
    let seatInstancedMesh = null;
    let frontAudienceMesh = null;
    let stageTarget = new THREE.Vector3(0, 3.4, -2); // 視線焦點置於舞台 Idol 身高處

    let idolGroup; // 偶像模型
    let sideScreenTexture, screenCanvas, screenCtx; // 兩側大螢幕動態貼圖

    // 計算 3D 空間座標
    function calculateCoordinates(r, s, layout) {
        let v_aisles = layout === 'decreasing' ? [15, 29, 42, 66, 79, 93] : [4, 14, 24, 34, 44, 64, 74, 84, 94, 104];
        
        // Z 軸深度：第 1 排距離舞台邊緣保留 5 公尺安全走道
        let z = 5 + (r - 1) * 0.9;
        if (r > 10) z += 2;
        if (r > 20) z += 2;
        if (r > 24) z += 3;
        if (r > 34) z += 2;

        // X 軸水平位移
        let x = 0;
        if (s <= 54) {
            for (let i = s; i < 54; i++) { x += 0.5; if (v_aisles.includes(i)) x += 1.0; }
            x += 0.25;
            x = -x;
        } else {
            for (let i = 55; i < s; i++) { x += 0.5; if (v_aisles.includes(i)) x += 1.0; }
            x += 0.25;
        }

        // 看台階梯高度 (Y 軸)
        let y = (r - 1) * 0.08;

        return { x, y, z };
    }

    function evaluateSeat(r, s, coords) {
        let distance = Math.sqrt(coords.x * coords.x + (coords.z - (-2)) * (coords.z - (-2)));
        let angle = Math.atan(Math.abs(coords.x) / (coords.z - (-2))) * (180 / Math.PI);
        let isMainStage = (s >= 40 && s <= 69);

        let scoreDist = Math.max(0, 100 - (distance / 50) * 60); 
        let scoreAngle = Math.max(0, 100 - (angle / 60) * 55);
        if (isMainStage) scoreAngle = Math.min(100, scoreAngle + 12);

        let final100 = Math.round((Math.min(scoreDist, scoreAngle) * 0.7) + (Math.max(scoreDist, scoreAngle) * 0.3));
        final100 = Math.min(100, Math.max(0, final100));

        let finalRank = "S 級【優質視野】"; let rankColor = "#1E90FF";
        if (final100 >= 85) { finalRank = "SSS 級【天選神位】"; rankColor = "#FFD700"; }
        else if (final100 >= 75) { finalRank = "SS 級【完美沉浸】"; rankColor = "#FF8C00"; }
        else if (final100 < 55) { finalRank = "B 級【輔助出動】"; rankColor = "#9370DB"; }

        return { distance, angle, final100, finalRank, rankColor };
    }

    // 初始化 Three.js 場景
    function init3D() {
        const container = document.getElementById('viewport');
        const canvas = document.getElementById('canvas3d');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.012);

        camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 200);
        camera.position.set(0, 25, 55);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.copy(stageTarget);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        buildEnvironment();
        buildSeatCloud();

        window.addEventListener('resize', onWindowResize);
        animate(0);
    }

// 替換 buildEnvironment()
function buildEnvironment() {
    // 1. 地板
    const floorGeo = new THREE.PlaneGeometry(160, 160);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.85 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // ==========================================
    // 2. 一字型平行寬舞台 (橫向貫穿 50 米，無前凸伸展台)
    // ==========================================
    const stageMat = new THREE.MeshStandardMaterial({ color: 0x1a1a20, roughness: 0.4 });
    // 主橫向台：寬 52m, 高 1.8m, 深 8m (中心在 z = -4，前緣剛好齊平 z = 0)
    const flatStage = new THREE.Mesh(new THREE.BoxGeometry(52, 1.8, 8), stageMat);
    flatStage.position.set(0, 0.9, -4);
    scene.add(flatStage);

    // 舞台前方安全圍欄隔板 (黑色邊緣)
    const barrierMat = new THREE.MeshBasicMaterial({ color: 0x08080a });
    const frontLip = new THREE.Mesh(new THREE.BoxGeometry(52.2, 0.2, 0.2), barrierMat);
    frontLip.position.set(0, 1.9, 0.05);
    scene.add(frontLip);

    // ==========================================
    // 3. 中央主頂棚 (鋼架立柱 + 三角斜屋頂)
    // ==========================================
    const trussMat = new THREE.MeshStandardMaterial({ color: 0x444450, metalness: 0.6, roughness: 0.3 });
    
    // 主頂棚 (三角柱體斜頂)
    const roofGeo = new THREE.CylinderGeometry(13, 13, 10, 3, 1, false);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x1e1e24, roughness: 0.6 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.rotation.x = Math.PI / 2;
    roof.rotation.z = Math.PI; // 頂端向上
    roof.scale.set(1, 0.45, 1);
    roof.position.set(0, 12, -4);
    scene.add(roof);

    // 中央四根大鋼架支柱 (Truss Pillars)
    const pGeo = new THREE.BoxGeometry(0.8, 10, 0.8);
    const pPositions = [[-9.5, -0.5], [9.5, -0.5], [-9.5, -7.5], [9.5, -7.5]];
    pPositions.forEach(pos => {
        const p = new THREE.Mesh(pGeo, trussMat);
        p.position.set(pos[0], 6.8, pos[1]);
        scene.add(p);
    });

    // 舞台頂棚下方的橫幅招牌 (橫眉看板)
    const bannerMat = new THREE.MeshBasicMaterial({ color: 0x0088cc });
    const headerBanner = new THREE.Mesh(new THREE.PlaneGeometry(18, 1.4), bannerMat);
    headerBanner.position.set(0, 9.8, -0.1);
    scene.add(headerBanner);

    // ==========================================
    // 4. 背面主 LED 螢幕
    // ==========================================
    const bgScreenMat = new THREE.MeshBasicMaterial({ color: 0x220044 });
    const mainScreen = new THREE.Mesh(new THREE.PlaneGeometry(18, 7.5), bgScreenMat);
    mainScreen.position.set(0, 5.6, -7.8);
    scene.add(mainScreen);

    // ==========================================
    // 5. 兩側「正面平行直立」巨型 LIVE 大螢幕 (完全平行於 X 軸)
    // ==========================================
    screenCanvas = document.createElement('canvas');
    screenCanvas.width = 384;
    screenCanvas.height = 640; // 直立比例 9:16
    screenCtx = screenCanvas.getContext('2d');
    sideScreenTexture = new THREE.CanvasTexture(screenCanvas);

    const liveScreenMat = new THREE.MeshBasicMaterial({ map: sideScreenTexture });
    const sideScreenGeo = new THREE.PlaneGeometry(6, 9.5); // 直立巨幕

    // 左外側、左內側大螢幕 (朝正面觀眾，不轉角度)
    const screenLeftOuter = new THREE.Mesh(sideScreenGeo, liveScreenMat);
    screenLeftOuter.position.set(-20, 6.8, -3.5);
    scene.add(screenLeftOuter);

    const screenLeftInner = new THREE.Mesh(sideScreenGeo, liveScreenMat);
    screenLeftInner.position.set(-13, 6.8, -3.5);
    scene.add(screenLeftInner);

    // 右內側、右外側大螢幕
    const screenRightInner = new THREE.Mesh(sideScreenGeo, liveScreenMat);
    screenRightInner.position.set(13, 6.8, -3.5);
    scene.add(screenRightInner);

    const screenRightOuter = new THREE.Mesh(sideScreenGeo, liveScreenMat);
    screenRightOuter.position.set(20, 6.8, -3.5);
    scene.add(screenRightOuter);

    // 兩側大螢幕背後滿版 Truss 鋼架背景牆
    const trussBackGeo = new THREE.BoxGeometry(16, 11, 0.4);
    const trussBackMat = new THREE.MeshStandardMaterial({ color: 0x2d2f38, roughness: 0.8 });
    const leftBackdrop = new THREE.Mesh(trussBackGeo, trussBackMat);
    leftBackdrop.position.set(-16.5, 7, -4.5);
    scene.add(leftBackdrop);

    const rightBackdrop = new THREE.Mesh(trussBackGeo, trussBackMat);
    rightBackdrop.position.set(16.5, 7, -4.5);
    scene.add(rightBackdrop);

    // ==========================================
    // 6. 偶像 Idol (站在中央主台前緣)
    // ==========================================
    idolGroup = new THREE.Group();

    // 亮粉色外套
    const bodyGeo = new THREE.CylinderGeometry(0.22, 0.28, 0.8, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff2a6d, roughness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.3;
    idolGroup.add(body);

    // 膚色頭部
    const headGeo = new THREE.SphereGeometry(0.16, 16, 16);
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdfd0 });
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.y = 1.85;
    idolGroup.add(head);

    // 髮型
    const hairGeo = new THREE.SphereGeometry(0.18, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x1f140e });
    const hair = new THREE.Mesh(hairGeo, hairMat);
    hair.position.y = 1.92;
    idolGroup.add(hair);

    // 麥克風
    const micGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.18, 8);
    const micMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const mic = new THREE.Mesh(micGeo, micMat);
    mic.position.set(0.15, 1.7, 0.2);
    mic.rotation.x = Math.PI / 4;
    idolGroup.add(mic);

    // 褲子
    const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const legL = new THREE.Mesh(legGeo, legMat);
    legL.position.set(-0.12, 0.45, 0);
    const legR = new THREE.Mesh(legGeo, legMat);
    legR.position.set(0.12, 0.45, 0);
    idolGroup.add(legL);
    idolGroup.add(legR);

    // 偶像站立在主舞台前端 (台面高度 y = 1.8)
    idolGroup.position.set(0, 1.8, -1.8);
    scene.add(idolGroup);

    // 舞台頂部射燈聚焦偶像
    const idolSpot = new THREE.SpotLight(0xffffff, 4, 30, Math.PI / 5, 0.25);
    idolSpot.position.set(0, 11, 2);
    idolSpot.target = idolGroup;
    scene.add(idolSpot);
}


    // 座位全數渲染：每一排 (含偶數排第8排)、每一號都完整繪製
    function buildSeatCloud() {
        if (seatInstancedMesh) {
            scene.remove(seatInstancedMesh);
        }

        const layout = document.getElementById('layoutSelect').value;
        const seatGeo = new THREE.BoxGeometry(0.42, 0.35, 0.42);
        const seatMat = new THREE.MeshStandardMaterial({ 
            color: 0x555566, 
            roughness: 0.6 
        });

        // 1~43 排，15~94 號全部繪製
        const rowCount = totalRows;
        const seatCountPerRow = (94 - 15 + 1);
        const totalCount = rowCount * seatCountPerRow;

        seatInstancedMesh = new THREE.InstancedMesh(seatGeo, seatMat, totalCount);
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        let idx = 0;
        for (let r = 1; r <= totalRows; r++) {
            for (let s = 15; s <= 94; s++) {
                const coords = calculateCoordinates(r, s, layout);
                dummy.position.set(coords.x, coords.y + 0.18, coords.z);
                dummy.updateMatrix();
                seatInstancedMesh.setMatrixAt(idx, dummy.matrix);

                // 加開區域 (粉色)，其餘一般座位 (灰藍色)
                if ((s >= 15 && s <= 20) || (s >= 89 && s <= 94)) {
                    color.setHex(0xffb3ba);
                } else {
                    color.setHex(r <= 24 ? 0x6e768e : 0x4d5366);
                }
                seatInstancedMesh.setColorAt(idx, color);
                idx++;
            }
        }

        seatInstancedMesh.instanceMatrix.needsUpdate = true;
        if (seatInstancedMesh.instanceColor) seatInstancedMesh.instanceColor.needsUpdate = true;
        scene.add(seatInstancedMesh);
    }

    // 前排觀眾模型：柔和淺色衣著與膚色
    function updateFrontAudience(r, s, layout) {
        if (frontAudienceMesh) {
            scene.remove(frontAudienceMesh);
            frontAudienceMesh = null;
        }

        if (r > 1) {
            const frontCoords = calculateCoordinates(r - 1, s, layout);
            frontAudienceMesh = new THREE.Group();

            // 1. 頭部 (溫暖膚色 + 淺棕髮色)
            const headGeo = new THREE.SphereGeometry(0.13, 16, 16);
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdfd0, roughness: 0.4 });
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.set(frontCoords.x, frontCoords.y + 1.22, frontCoords.z);

            const hairGeo = new THREE.SphereGeometry(0.14, 16, 16, 0, Math.PI * 2, 0, Math.PI / 1.7);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.6 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(frontCoords.x, frontCoords.y + 1.25, frontCoords.z);

            // 2. 身體衣服 (明亮米白/淺灰色)
            const bodyGeo = new THREE.CylinderGeometry(0.22, 0.26, 0.65, 16);
            const clothMat = new THREE.MeshStandardMaterial({ color: 0xdcdde1, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, clothMat);
            body.position.set(frontCoords.x, frontCoords.y + 0.78, frontCoords.z);

            frontAudienceMesh.add(head);
            frontAudienceMesh.add(hair);
            frontAudienceMesh.add(body);
            scene.add(frontAudienceMesh);
        }
    }

function renderLiveScreen(time) {
    if (!screenCtx) return;

    // 1. 直立螢幕背景
    const gradient = screenCtx.createLinearGradient(0, 0, 0, 640);
    gradient.addColorStop(0, '#0a0020');
    gradient.addColorStop(0.5, '#2e0050');
    gradient.addColorStop(1, '#050014');
    screenCtx.fillStyle = gradient;
    screenCtx.fillRect(0, 0, 384, 640);

    // 2. 聚光光環
    screenCtx.beginPath();
    screenCtx.arc(192, 300, 140 + Math.sin(time * 3) * 8, 0, Math.PI * 2);
    screenCtx.fillStyle = 'rgba(255, 42, 109, 0.25)';
    screenCtx.fill();

    // 3. 直立偶像特寫 (上半身)
    // 臉部
    screenCtx.fillStyle = '#ffdfd0';
    screenCtx.beginPath();
    screenCtx.arc(192, 230 + Math.sin(time * 2) * 5, 55, 0, Math.PI * 2);
    screenCtx.fill();

    // 頭髮
    screenCtx.fillStyle = '#1f140e';
    screenCtx.beginPath();
    screenCtx.arc(192, 215 + Math.sin(time * 2) * 5, 60, Math.PI, Math.PI * 2);
    screenCtx.fill();

    // 舞台打歌服裝
    screenCtx.fillStyle = '#ff2a6d';
    screenCtx.beginPath();
    screenCtx.moveTo(110, 640);
    screenCtx.lineTo(150, 290);
    screenCtx.lineTo(234, 290);
    screenCtx.lineTo(274, 640);
    screenCtx.closePath();
    screenCtx.fill();

    // 4. LIVE 導播文字與紅點
    screenCtx.fillStyle = '#ff0033';
    screenCtx.beginPath();
    screenCtx.arc(35, 45, 8, 0, Math.PI * 2);
    screenCtx.fill();

    screenCtx.fillStyle = '#ffffff';
    screenCtx.font = 'bold 20px Arial';
    screenCtx.fillText('LIVE  IMAG', 52, 52);

    // 5. LED 晶格細線條
    screenCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    screenCtx.lineWidth = 2;
    for (let i = 0; i < 640; i += 8) {
        screenCtx.beginPath();
        screenCtx.moveTo(0, i);
        screenCtx.lineTo(384, i);
        screenCtx.stroke();
    }

    sideScreenTexture.needsUpdate = true;
}

    // 進入座位視角
    function applySeatView() {
        const r = parseInt(document.getElementById('rowA').value);
        const s = parseInt(document.getElementById('seatA').value);
        const heightCm = parseFloat(document.getElementById('viewerHeight').value) || 165;
        const posture = document.getElementById('postureSelect').value;

        // 坐姿眼高計算 (椅高 0.42m + 坐姿眼高)
        let eyeHeight = posture === 'sit' ? (0.42 + (heightCm * 0.45 / 100)) : (heightCm * 0.93 / 100);

        if (r < 1 || r > totalRows || s < 1 || s > 108) {
            alert('請輸入有效範圍內的座位 (排: 1~43, 號: 1~108)');
            return;
        }

        const layout = document.getElementById('layoutSelect').value;
        const coords = calculateCoordinates(r, s, layout);
        const stats = evaluateSeat(r, s, coords);

        // 相機移至坐姿眼高位置
        camera.position.set(coords.x, coords.y + eyeHeight, coords.z);
        controls.target.copy(stageTarget);
        controls.update();

        // 更新前排觀眾
        updateFrontAudience(r, s, layout);

        document.getElementById('hudInfo').innerHTML = `
            <b>第 ${r} 排 ${s} 號</b> (${posture === 'sit' ? '坐姿' : '站姿'}視角)<br>
            舞台直線距離：${stats.distance.toFixed(1)} m ｜ 視角偏角：${stats.angle.toFixed(1)}°<br>
            離地眼高：${(coords.y + eyeHeight).toFixed(2)} m
        `;

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `
            <div style="font-size: 15px; font-weight: bold;">第 ${r} 排 ${s} 號 · 視野診斷</div>
            <div class="score-display" style="color: #00BFFF;">視野分數：${stats.final100} 分</div>
            <span class="final-rank" style="background:${stats.rankColor};">${stats.finalRank}</span>
            <span class="advice-item">📐 舞台直線距離：<b>${stats.distance.toFixed(1)}m</b></span>
            <span class="advice-item">🪑 視點高度：<b>${(coords.y + eyeHeight).toFixed(2)}m</b> (已計入椅面與前排坐姿)</span>
            <span class="advice-item">👁️ 水平偏角：<b>${stats.angle.toFixed(1)}°</b></span>
        `;
    }

    function setFOV(fovVal) {
        camera.fov = fovVal;
        camera.updateProjectionMatrix();
    }

    function resetToOverview() {
        if (frontAudienceMesh) {
            scene.remove(frontAudienceMesh);
            frontAudienceMesh = null;
        }
        camera.position.set(0, 25, 55);
        camera.fov = 60;
        camera.updateProjectionMatrix();
        controls.target.copy(stageTarget);
        controls.update();
        document.getElementById('hudInfo').innerHTML = `目前視角：全場俯瞰預覽`;
    }

    function onWindowResize() {
        const container = document.getElementById('viewport');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate(currentTime) {
        requestAnimationFrame(animate);

        const time = currentTime * 0.001;

        if (idolGroup) {
            idolGroup.position.y = 2 + Math.sin(time * 2.5) * 0.02;
            idolGroup.rotation.y = Math.sin(time * 1.2) * 0.12;
        }

        renderLiveScreen(time);

        controls.update();
        renderer.render(scene, camera);
    }

    window.onload = init3D;
</script>
</body>
</html>
