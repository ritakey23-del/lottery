<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPEN! 夢想音樂節 - 3D 坐席真實視野</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #0c0f1d; color: #fff; margin: 0; padding: 0; overflow-x: hidden; user-select: none; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 380px; background: #13172b; padding: 20px; overflow-y: auto; border-right: 1px solid #242b4d; z-index: 10; display: flex; flex-direction: column; gap: 15px; }
        .viewport-3d { flex: 1; position: relative; background: #060810; cursor: grab; }
        .viewport-3d:active { cursor: grabbing; }
        #canvas3d { width: 100%; height: 100%; display: block; }

        .hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(13, 17, 36, 0.85); padding: 12px 18px; border-radius: 8px; font-size: 13px; line-height: 1.5; pointer-events: none; border: 1px solid #2d3766; }
        .fov-toggle { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 8px; }
        .fov-btn { background: rgba(20, 26, 54, 0.9); color: #fff; border: 1px solid #414f8c; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .fov-btn:hover { background: #2f3a6e; }

        h2 { margin: 0; font-size: 20px; color: #fff; }
        .subtitle { font-size: 13px; color: #ff3377; margin-top: 5px; font-weight: bold; }
        .box { background: #1a203a; padding: 15px; border-radius: 8px; border: 1px solid #28325c; }
        .input-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        input[type="number"], select { padding: 8px; border-radius: 4px; border: 1px solid #3d4c8a; background: #0f1324; color: #fff; font-size: 14px; }
        input[type="number"] { width: 75px; text-align: center; }
        button.action-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #d83d89, #6c2d8e); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button.action-btn:hover { opacity: 0.9; }

        .result-card { padding: 12px; border-radius: 6px; background: #1c233f; margin-top: 10px; border-left: 4px solid #d83d89; }
        .score-display { font-size: 20px; font-weight: bold; margin: 6px 0; }
        .final-rank { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .advice-item { display: block; font-size: 12px; color: #ccd3eb; margin-top: 4px; }

        .color-legend { display: flex; gap: 10px; font-size: 11px; margin-top: 5px; }
        .legend-badge { display: flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 2px; }

        @media (max-width: 900px) {
            .app-container { flex-direction: column-reverse; height: auto; }
            .sidebar { width: 100%; height: auto; }
            .viewport-3d { height: 60vh; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div>
            <h2>OPEN! 夢想音樂節</h2>
            <div class="subtitle">12/4 - 12/5 高雄夢時代正對面廣場</div>
            <div class="color-legend">
                <div class="legend-badge"><span class="dot" style="background:#D83D89;"></span>超級搖滾區 (1~24排)</div>
                <div class="legend-badge"><span class="dot" style="background:#6C2D8E;"></span>搖滾區 (25~43排)</div>
            </div>
        </div>

        <div class="box">
            <div class="input-group">
                <label>觀看姿勢</label>
                <select id="postureSelect" onchange="applySeatView()">
                    <option value="sit" selected>🪑 坐姿 (真實低坐姿)</option>
                    <option value="stand">🧍 站姿 (站立嗨唱)</option>
                </select>
            </div>
            <div class="input-group">
                <label>身高校正</label>
                <div>
                    <input type="number" id="viewerHeight" value="165" min="130" max="210"> cm
                </div>
            </div>
            <div class="input-group">
                <label>排法模式</label>
                <select id="layoutSelect" onchange="buildSeatCloud()">
                    <option value="10x10" selected>10x10 排法 (有中走道)</option>
                    <option value="decreasing">遞減排法</option>
                </select>
            </div>
            <div class="input-group">
                <label>查詢座位</label>
                <div>
                    第 <input type="number" id="rowA" value="2" min="1" max="43"> 排
                    <input type="number" id="seatA" value="51" min="1" max="108"> 號
                </div>
            </div>

            <button class="action-btn" onclick="applySeatView()">切換至該座位 (原地轉頭)</button>
        </div>

        <div id="resultBox" class="result-card" style="display: none;"></div>
        
        <div style="font-size: 12px; color: #8792b8; line-height: 1.5;">
            💡 實景還原重點：<br>
            • <b>第一人稱轉頭</b>：鎖死在椅子上，滑鼠/手指拖曳直接模擬轉動脖子環視。<br>
            • <b>左右各一橫向大螢幕 (16:9)</b>：主舞台兩側各掛一面大橫幕與 Truss 鋼架。<br>
            • <b>黑色折疊椅與鐵馬護欄</b>：前方視線完全貼齊實拍照高度。<br>
            • <b>白色音控棚 (FOH)</b>：位於搖滾區中後方交界處。
        </div>
    </div>

    <div class="viewport-3d" id="viewport">
        <canvas id="canvas3d"></canvas>
        <div class="hud-overlay" id="hudInfo">
            目前視角：全場俯瞰預覽<br>
            請於左側輸入座位排號並點擊切換
        </div>
        <div class="fov-toggle">
            <button class="fov-btn" onclick="setFOV(65)">1× 主鏡頭</button>
            <button class="fov-btn" onclick="setFOV(95)">0.5× 超廣角</button>
            <button class="fov-btn" onclick="resetToOverview()">全場俯瞰</button>
        </div>
    </div>
</div>

<script>
    const totalRows = 43;
    let scene, camera, renderer;
    let seatInstancedMesh = null;
    let audienceHeadMesh = null;
    let audienceBodyMesh = null;

    let idolGroup; 
    let sideScreenTexture, screenCanvas, screenCtx;
    let mainCenterScreenTexture, mainScreenCanvas, mainScreenCtx;

    // 第一人稱轉頭視角控制變數 (FPS Look Controls)
    let isUserLooking = false;
    let isOverview = true;
    let yaw = 0;   // 水平旋轉角度 (左右)
    let pitch = 0; // 垂直旋轉角度 (上下仰角)
    let previousPointerX = 0;
    let previousPointerY = 0;
    let cameraFixedPos = new THREE.Vector3(0, 22, 52);

    function calculateCoordinates(r, s, layout) {
        let v_aisles = layout === 'decreasing' ? [15, 29, 42, 66, 79, 93] : [4, 14, 24, 34, 44, 64, 74, 84, 94, 104];
        
        // Z 軸深度：折疊椅前後排距約 0.85m，第 1 排距離護欄與舞台約 5.0m
        let z = 5.0 + (r - 1) * 0.85;
        if (r > 10) z += 1.6;
        if (r > 20) z += 1.6;
        if (r > 24) z += 3.2; // 超級搖滾與搖滾區交界大走道
        if (r > 34) z += 1.6;

        let x = 0;
        if (s <= 54) {
            for (let i = s; i < 54; i++) { x += 0.50; if (v_aisles.includes(i)) x += 1.2; }
            x += 0.28;
            x = -x;
        } else {
            for (let i = 55; i < s; i++) { x += 0.50; if (v_aisles.includes(i)) x += 1.2; }
            x += 0.28;
        }

        // 戶外廣場完全平地
        let y = 0.0;
        return { x, y, z };
    }

    function evaluateSeat(r, s, coords) {
        let distance = Math.sqrt(coords.x * coords.x + (coords.z - (-1.8)) * (coords.z - (-1.8)));
        let angle = Math.atan(Math.abs(coords.x) / (coords.z - (-1.8))) * (180 / Math.PI);
        let isMainStage = (s >= 40 && s <= 69);

        let scoreDist = Math.max(0, 100 - (distance / 50) * 60); 
        let scoreAngle = Math.max(0, 100 - (angle / 60) * 55);
        if (isMainStage) scoreAngle = Math.min(100, scoreAngle + 12);

        let final100 = Math.round((Math.min(scoreDist, scoreAngle) * 0.7) + (Math.max(scoreDist, scoreAngle) * 0.3));
        final100 = Math.min(100, Math.max(0, final100));

        let zoneName = r <= 24 ? "超級搖滾區 ($3999)" : "搖滾區 ($2999)";
        let zoneColor = r <= 24 ? "#D83D89" : "#6C2D8E";

        let finalRank = "S 級【優質視野】";
        if (final100 >= 85) finalRank = "SSS 級【天選神位】";
        else if (final100 >= 75) finalRank = "SS 級【完美沉浸】";
        else if (final100 < 55) finalRank = "B 級【輔助出動】";

        return { distance, angle, final100, finalRank, zoneName, zoneColor };
    }

    function init3D() {
        const container = document.getElementById('viewport');
        const canvas = document.getElementById('canvas3d');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060814);
        scene.fog = new THREE.FogExp2(0x060814, 0.008);

        camera = new THREE.PerspectiveCamera(65, container.clientWidth / container.clientHeight, 0.1, 200);
        camera.position.copy(cameraFixedPos);
        camera.lookAt(0, 3.5, -2);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        buildEnvironment();
        buildSeatCloud();

        setupFirstPersonControls();

        window.addEventListener('resize', onWindowResize);
        animate(0);
    }

    // 建立實景舞台：平行一字台、左右各一橫螢幕、白色音控棚、折疊椅與護欄
    function buildEnvironment() {
        // 地面 (深灰柏油廣場)
        const floorGeo = new THREE.PlaneGeometry(160, 160);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x12141c, roughness: 0.95 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 1. 平行一字主舞台 (台高 2.0m，前緣在 z = 0)
        const stageMat = new THREE.MeshStandardMaterial({ color: 0x11131a, roughness: 0.7 });
        const flatStage = new THREE.Mesh(new THREE.BoxGeometry(50, 2.0, 8), stageMat);
        flatStage.position.set(0, 1.0, -4);
        scene.add(flatStage);

        // 舞台前沿斜切黑布遮罩 (對齊第四張照片)
        const apronGeo = new THREE.BoxGeometry(50.2, 0.6, 0.4);
        const apronMat = new THREE.MeshStandardMaterial({ color: 0x07080c, roughness: 0.9 });
        const apron = new THREE.Mesh(apronGeo, apronMat);
        apron.position.set(0, 1.8, 0.1);
        scene.add(apron);

        // 2. 舞台前緣鐵馬護欄 (高 1.2m，架在第一排前方 z = 3.6m 處)
        const barrierGeo = new THREE.BoxGeometry(46, 1.2, 0.05);
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0x18181c, metalness: 0.8, roughness: 0.4 });
        const barrier = new THREE.Mesh(barrierGeo, barrierMat);
        barrier.position.set(0, 0.6, 3.6);
        scene.add(barrier);

        // 3. 舞台前沿監聽音箱與低音箱 (高度疊加到 2.45m)
        const monitorGeo = new THREE.BoxGeometry(1.2, 0.45, 0.7);
        const monitorMat = new THREE.MeshStandardMaterial({ color: 0x050608 });
        for (let x = -20; x <= 20; x += 3.4) {
            const mon = new THREE.Mesh(monitorGeo, monitorMat);
            mon.position.set(x, 2.22, -0.3);
            scene.add(mon);
        }

        // 4. 中央斜頂主頂棚
        const trussMat = new THREE.MeshStandardMaterial({ color: 0x484f6d, metalness: 0.7, roughness: 0.3 });
        
        const roofShape = new THREE.Shape();
        roofShape.moveTo(-10.5, 0);   
        roofShape.lineTo(0, 2.6);     
        roofShape.lineTo(10.5, 0);    
        roofShape.closePath();

        const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: 8.5, bevelEnabled: false }), 
            new THREE.MeshStandardMaterial({ color: 0x181c30, roughness: 0.6 }));
        roof.position.set(0, 10.5, -8.2);
        scene.add(roof);

        // 頂棚大橫眉 (OPEN! DREAM WORLD 看板)
        const headerBannerGeo = new THREE.PlaneGeometry(18, 1.6);
        const headerCanvas = document.createElement('canvas');
        headerCanvas.width = 1024;
        headerCanvas.height = 128;
        const hCtx = headerCanvas.getContext('2d');
        hCtx.fillStyle = '#080c20';
        hCtx.fillRect(0, 0, 1024, 128);
        hCtx.fillStyle = '#ffffff';
        hCtx.font = '900 52px "Arial Black", sans-serif';
        hCtx.textAlign = 'center';
        hCtx.fillText('OPEN!  DREAM WORLD', 512, 85);
        const headerTex = new THREE.CanvasTexture(headerCanvas);
        const headerBanner = new THREE.Mesh(headerBannerGeo, new THREE.MeshBasicMaterial({ map: headerTex }));
        headerBanner.position.set(0, 9.8, -0.2);
        scene.add(headerBanner);

        // 鋼架支柱
        const pGeo = new THREE.BoxGeometry(0.8, 11, 0.8);
        [[-9.5, -0.5], [9.5, -0.5], [-9.5, -7.5], [9.5, -7.5]].forEach(pos => {
            const p = new THREE.Mesh(pGeo, trussMat);
            p.position.set(pos[0], 6.5, pos[1]);
            scene.add(p);
        });

        // 5. 舞台正後方中央主視覺 LED 巨幕 (17m x 7.5m)
        mainScreenCanvas = document.createElement('canvas');
        mainScreenCanvas.width = 1024;
        mainScreenCanvas.height = 512;
        mainScreenCtx = mainScreenCanvas.getContext('2d');
        mainCenterScreenTexture = new THREE.CanvasTexture(mainScreenCanvas);

        const mainScreen = new THREE.Mesh(new THREE.PlaneGeometry(17, 7.5), new THREE.MeshBasicMaterial({ map: mainCenterScreenTexture }));
        mainScreen.position.set(0, 6.2, -7.8);
        scene.add(mainScreen);

        // 6. 懸吊線性陣列喇叭 (Line Array)
        const lineArrayGeo = new THREE.BoxGeometry(0.7, 0.35, 0.5);
        const paMat = new THREE.MeshStandardMaterial({ color: 0x08080a });
        [-10.5, 10.5].forEach(xPos => {
            const paGroup = new THREE.Group();
            for (let i = 0; i < 9; i++) {
                const box = new THREE.Mesh(lineArrayGeo, paMat);
                box.position.set(0, -i * 0.42, Math.pow(i * 0.08, 1.4) * 0.3);
                box.rotation.x = (i * 0.04);
                paGroup.add(box);
            }
            paGroup.position.set(xPos, 9.5, -0.2);
            scene.add(paGroup);
        });

        // 7. 【精確修改：左右兩側各只有一面「橫向 (16:9)」轉播大螢幕】
        screenCanvas = document.createElement('canvas');
        screenCanvas.width = 640;
        screenCanvas.height = 360; // 16:9 橫向比例
        screenCtx = screenCanvas.getContext('2d');
        sideScreenTexture = new THREE.CanvasTexture(screenCanvas);

        const liveScreenMat = new THREE.MeshBasicMaterial({ map: sideScreenTexture });
        const sideScreenGeo = new THREE.PlaneGeometry(9.6, 5.4); // 橫向大螢幕 (寬9.6m, 高5.4m)

        // 左側單面大螢幕 (橫向)
        const screenLeft = new THREE.Mesh(sideScreenGeo, liveScreenMat);
        screenLeft.position.set(-17, 6.2, -3.5);
        scene.add(screenLeft);

        // 右側單面大螢幕 (橫向)
        const screenRight = new THREE.Mesh(sideScreenGeo, liveScreenMat);
        screenRight.position.set(17, 6.2, -3.5);
        scene.add(screenRight);

        // 8. 【新增：中後方白色音控棚 (FOH 帳篷)】(依第二張照片置於第 24 排橫走道後方中央)
        const tentGeo = new THREE.BoxGeometry(6.5, 3.2, 4.0);
        const tentMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 });
        const fohTent = new THREE.Mesh(tentGeo, tentMat);
        fohTent.position.set(0, 1.6, 28); // 位於第 24 排後方中軸線
        scene.add(fohTent);

        // 9. 偶像 (Idol) 站立於 y = 2.0 舞台面上
        idolGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.8, 16), 
            new THREE.MeshStandardMaterial({ color: 0xd83d89, roughness: 0.3 }));
        body.position.y = 1.3;
        idolGroup.add(body);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), 
            new THREE.MeshStandardMaterial({ color: 0xffdfd0 }));
        head.position.y = 1.85;
        idolGroup.add(head);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), 
            new THREE.MeshStandardMaterial({ color: 0x1f140e }));
        hair.position.y = 1.92;
        idolGroup.add(hair);

        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        legL.position.set(-0.12, 0.45, 0);
        const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        legR.position.set(0.12, 0.45, 0);
        idolGroup.add(legL);
        idolGroup.add(legR);

        idolGroup.position.set(0, 2.0, -1.8);
        scene.add(idolGroup);

        const idolSpot = new THREE.SpotLight(0xffffff, 4, 30, Math.PI / 5, 0.25);
        idolSpot.position.set(0, 11, 2);
        idolSpot.target = idolGroup;
        scene.add(idolSpot);
    }

    // 全座位渲染 (每一張黑色折疊椅與管架)
    function buildSeatCloud() {
        if (seatInstancedMesh) scene.remove(seatInstancedMesh);

        const layout = document.getElementById('layoutSelect').value;
        const seatGeo = new THREE.BoxGeometry(0.44, 0.38, 0.42);
        const seatMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });

        const totalCount = totalRows * (94 - 15 + 1);
        seatInstancedMesh = new THREE.InstancedMesh(seatGeo, seatMat, totalCount);
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        let idx = 0;
        for (let r = 1; r <= totalRows; r++) {
            for (let s = 15; s <= 94; s++) {
                const coords = calculateCoordinates(r, s, layout);
                // 折疊椅椅面離地 0.42m
                dummy.position.set(coords.x, coords.y + 0.21, coords.z);
                dummy.updateMatrix();
                seatInstancedMesh.setMatrixAt(idx, dummy.matrix);

                // 官方配色標記
                if (r <= 24) {
                    color.setHex(0xd83d89);
                } else {
                    color.setHex(0x6c2d8e);
                }
                seatInstancedMesh.setColorAt(idx, color);
                idx++;
            }
        }

        seatInstancedMesh.instanceMatrix.needsUpdate = true;
        if (seatInstancedMesh.instanceColor) seatInstancedMesh.instanceColor.needsUpdate = true;
        scene.add(seatInstancedMesh);
    }

    // 前方觀眾群邏輯 (第 1 排前方無人，後排渲染真實人海)
    function updateFrontAudience(currentR, currentS, layout) {
        if (audienceHeadMesh) scene.remove(audienceHeadMesh);
        if (audienceBodyMesh) scene.remove(audienceBodyMesh);
        audienceHeadMesh = null;
        audienceBodyMesh = null;

        if (currentR <= 1) return;

        const rowsInFront = currentR - 1;
        const minS = Math.max(15, currentS - 14);
        const maxS = Math.min(94, currentS + 14);
        const seatsPerSpan = (maxS - minS + 1);
        const totalAudience = rowsInFront * seatsPerSpan;

        if (totalAudience <= 0) return;

        const headGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x221a15, roughness: 0.7 });
        audienceHeadMesh = new THREE.InstancedMesh(headGeo, hairMat, totalAudience);

        const bodyGeo = new THREE.CylinderGeometry(0.14, 0.17, 0.48, 12);
        const clothMat = new THREE.MeshStandardMaterial({ color: 0x2c2d38, roughness: 0.6 }); // 現場多數穿深色/T恤
        audienceBodyMesh = new THREE.InstancedMesh(bodyGeo, clothMat, totalAudience);

        const dummyHead = new THREE.Object3D();
        const dummyBody = new THREE.Object3D();

        let idx = 0;
        for (let r = 1; r < currentR; r++) {
            for (let s = minS; s <= maxS; s++) {
                const coords = calculateCoordinates(r, s, layout);
                // 坐姿高度 (椅面 0.42m + 頭部約 0.96m)
                dummyHead.position.set(coords.x, coords.y + 0.96, coords.z);
                dummyHead.updateMatrix();
                audienceHeadMesh.setMatrixAt(idx, dummyHead.matrix);

                dummyBody.position.set(coords.x, coords.y + 0.68, coords.z);
                dummyBody.updateMatrix();
                audienceBodyMesh.setMatrixAt(idx, dummyBody.matrix);

                idx++;
            }
        }

        audienceHeadMesh.instanceMatrix.needsUpdate = true;
        audienceBodyMesh.instanceMatrix.needsUpdate = true;

        scene.add(audienceHeadMesh);
        scene.add(audienceBodyMesh);
    }

    // 繪製正中央主視覺螢幕與左右橫向轉播螢幕
    function renderScreens(time) {
        if (mainScreenCtx) {
            const grad = mainScreenCtx.createLinearGradient(0, 0, 1024, 512);
            grad.addColorStop(0, '#0a0d24');
            grad.addColorStop(0.5, '#182046');
            grad.addColorStop(1, '#0a0d24');
            mainScreenCtx.fillStyle = grad;
            mainScreenCtx.fillRect(0, 0, 1024, 512);

            mainScreenCtx.strokeStyle = '#d83d89';
            mainScreenCtx.lineWidth = 6;
            mainScreenCtx.beginPath();
            mainScreenCtx.arc(512, 160, 90 + Math.sin(time * 2) * 5, 0, Math.PI * 2);
            mainScreenCtx.stroke();

            mainScreenCtx.strokeStyle = '#00b4d8';
            mainScreenCtx.lineWidth = 4;
            mainScreenCtx.beginPath();
            mainScreenCtx.arc(512, 160, 110 + Math.cos(time * 2) * 5, 0, Math.PI * 2);
            mainScreenCtx.stroke();

            mainScreenCtx.fillStyle = '#ffffff';
            mainScreenCtx.font = '900 68px "Arial Black", sans-serif';
            mainScreenCtx.textAlign = 'center';
            mainScreenCtx.fillText('OPEN!', 512, 185);

            mainScreenCtx.fillStyle = '#ffe500';
            mainScreenCtx.font = '900 52px "Microsoft JhengHei", Arial';
            mainScreenCtx.fillText('夢想音樂節', 512, 330);

            mainScreenCtx.fillStyle = '#ffffff';
            mainScreenCtx.font = 'bold 28px Arial';
            mainScreenCtx.fillText('12/4 (Fri) — 12/5 (Sat)', 512, 390);

            mainCenterScreenTexture.needsUpdate = true;
        }

        // 橫向 16:9 轉播大螢幕
        if (screenCtx) {
            const gradient = screenCtx.createLinearGradient(0, 0, 640, 360);
            gradient.addColorStop(0, '#0a0020');
            gradient.addColorStop(0.5, '#2e0050');
            gradient.addColorStop(1, '#050014');
            screenCtx.fillStyle = gradient;
            screenCtx.fillRect(0, 0, 640, 360);

            screenCtx.beginPath();
            screenCtx.arc(320, 200, 110 + Math.sin(time * 3) * 6, 0, Math.PI * 2);
            screenCtx.fillStyle = 'rgba(216, 61, 137, 0.28)';
            screenCtx.fill();

            // 偶像上半身特寫
            screenCtx.fillStyle = '#ffdfd0';
            screenCtx.beginPath();
            screenCtx.arc(320, 150 + Math.sin(time * 2) * 4, 45, 0, Math.PI * 2);
            screenCtx.fill();

            screenCtx.fillStyle = '#1f140e';
            screenCtx.beginPath();
            screenCtx.arc(320, 140 + Math.sin(time * 2) * 4, 48, Math.PI, Math.PI * 2);
            screenCtx.fill();

            screenCtx.fillStyle = '#d83d89';
            screenCtx.beginPath();
            screenCtx.moveTo(230, 360);
            screenCtx.lineTo(265, 195);
            screenCtx.lineTo(375, 195);
            screenCtx.lineTo(410, 360);
            screenCtx.closePath();
            screenCtx.fill();

            screenCtx.fillStyle = '#ff0033';
            screenCtx.beginPath();
            screenCtx.arc(35, 35, 8, 0, Math.PI * 2);
            screenCtx.fill();

            screenCtx.fillStyle = '#ffffff';
            screenCtx.font = 'bold 20px Arial';
            screenCtx.textAlign = 'left';
            screenCtx.fillText('LIVE  CAM 1', 52, 42);

            sideScreenTexture.needsUpdate = true;
        }
    }

    // =========================================================================
    // 第一人稱「原地轉頭」控制器核心 (鎖死在椅子上，只旋轉脖子)
    // =========================================================================
    function setupFirstPersonControls() {
        const dom = document.getElementById('viewport');

        function onPointerDown(e) {
            isUserLooking = true;
            previousPointerX = e.clientX || (e.touches && e.touches[0].clientX);
            previousPointerY = e.clientY || (e.touches && e.touches[0].clientY);
        }

        function onPointerMove(e) {
            if (!isUserLooking) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const deltaX = clientX - previousPointerX;
            const deltaY = clientY - previousPointerY;

            previousPointerX = clientX;
            previousPointerY = clientY;

            // 轉頭靈敏度
            yaw -= deltaX * 0.0035;
            pitch -= deltaY * 0.0035;

            // 限制仰角：不能往下看穿地底，也不能後仰折斷脖子
            pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 3, pitch));

            updateCameraDirection();
        }

        function onPointerUp() {
            isUserLooking = false;
        }

        dom.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        dom.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
    }

    function updateCameraDirection() {
        if (isOverview) {
            camera.position.set(0, 22, 52);
            camera.lookAt(0, 3.5, -2);
            return;
        }

        // 相機座標焊死在椅面眼高，絕對不浮起
        camera.position.copy(cameraFixedPos);

        // 依據轉頭仰角與水平角計算朝向向量
        const lookTarget = new THREE.Vector3(
            cameraFixedPos.x + Math.sin(yaw) * Math.cos(pitch),
            cameraFixedPos.y + Math.sin(pitch),
            cameraFixedPos.z - Math.cos(yaw) * Math.cos(pitch)
        );
        camera.lookAt(lookTarget);
    }

    function applySeatView() {
        const r = parseInt(document.getElementById('rowA').value);
        const s = parseInt(document.getElementById('seatA').value);
        const heightCm = parseFloat(document.getElementById('viewerHeight').value) || 165;
        const posture = document.getElementById('postureSelect').value;

        // 真實低坐姿眼高：椅高 0.42m + 坐姿上半身眼高 (身高的 42%)
        // 165cm 成年人坐下眼高精確在 1.11m
        let eyeHeight = posture === 'sit' ? (0.42 + (heightCm * 0.42 / 100)) : (heightCm * 0.92 / 100);

        if (r < 1 || r > totalRows || s < 1 || s > 108) {
            alert('請輸入有效範圍內的座位 (排: 1~43, 號: 1~108)');
            return;
        }

        const layout = document.getElementById('layoutSelect').value;
        const coords = calculateCoordinates(r, s, layout);
        const stats = evaluateSeat(r, s, coords);

        isOverview = false;
        cameraFixedPos.set(coords.x, coords.y + eyeHeight, coords.z);

        // 計算初始朝向舞台中央偶像的偏角與仰角
        const dx = 0 - coords.x;
        const dz = (-1.8) - coords.z;
        const dy = 3.6 - (coords.y + eyeHeight); // 仰望舞台 Idol

        yaw = -Math.atan2(dx, -dz);
        pitch = Math.atan2(dy, Math.sqrt(dx * dx + dz * dz));

        updateCameraDirection();
        updateFrontAudience(r, s, layout);

        document.getElementById('hudInfo').innerHTML = `
            <b>第 ${r} 排 ${s} 號</b> (${stats.zoneName})<br>
            舞台距離：${stats.distance.toFixed(1)} m ｜ 視角偏角：${stats.angle.toFixed(1)}°<br>
            離地眼高：${(coords.y + eyeHeight).toFixed(2)} m ${r === 1 ? '<b>(第一排無遮擋)</b>' : `(前方有 ${r - 1} 排觀眾)`}
        `;

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.style.borderLeftColor = stats.zoneColor;
        resultBox.innerHTML = `
            <div style="font-size: 15px; font-weight: bold;">第 ${r} 排 ${s} 號 · <span style="color:${stats.zoneColor};">${stats.zoneName}</span></div>
            <div class="score-display" style="color: #00BFFF;">視野分數：${stats.final100} 分</div>
            <span class="final-rank" style="background:${stats.zoneColor};">${stats.finalRank}</span>
            <span class="advice-item">📐 舞台直線距離：<b>${stats.distance.toFixed(1)}m</b></span>
            <span class="advice-item">🪑 視點高度：<b>${(coords.y + eyeHeight).toFixed(2)}m</b> (真實平地折疊椅坐姿)</span>
            <span class="advice-item">👁️ 水平偏角：<b>${stats.angle.toFixed(1)}°</b></span>
        `;
    }

    function setFOV(fovVal) {
        camera.fov = fovVal;
        camera.updateProjectionMatrix();
    }

    function resetToOverview() {
        if (audienceHeadMesh) scene.remove(audienceHeadMesh);
        if (audienceBodyMesh) scene.remove(audienceBodyMesh);
        audienceHeadMesh = null;
        audienceBodyMesh = null;

        isOverview = true;
        camera.fov = 65;
        camera.updateProjectionMatrix();
        camera.position.set(0, 22, 52);
        camera.lookAt(0, 3.5, -2);
        document.getElementById('hudInfo').innerHTML = `目前視角：全場俯瞰預覽`;
    }

    function onWindowResize() {
        const container = document.getElementById('viewport');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate(currentTime) {
        requestAnimationFrame(animate);

        const time = currentTime * 0.001;

        if (idolGroup) {
            idolGroup.position.y = 2.0 + Math.sin(time * 2.5) * 0.02;
            idolGroup.rotation.y = Math.sin(time * 1.2) * 0.12;
        }

        renderScreens(time);
        renderer.render(scene, camera);
    }

    window.onload = init3D;
</script>
