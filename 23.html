<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢想音樂節 - 3D 坐席視野模擬器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 400px; background: #1a1a1a; padding: 20px; overflow-y: auto; border-right: 1px solid #333; z-index: 10; display: flex; flex-direction: column; gap: 15px; }
        .viewport-3d { flex: 1; position: relative; background: #050505; }
        #canvas3d { width: 100%; height: 100%; display: block; }

        .hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 12px 18px; border-radius: 8px; font-size: 13px; line-height: 1.5; pointer-events: none; border: 1px solid #444; }
        .fov-toggle { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 8px; }
        .fov-btn { background: rgba(30,30,30,0.85); color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .fov-btn:hover { background: #444; }

        h2 { margin: 0; font-size: 20px; }
        .subtitle { font-size: 13px; color: #f39c12; margin-top: 5px; }
        .box { background: #242424; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .input-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        input[type="number"], select { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; font-size: 14px; }
        input[type="number"] { width: 75px; text-align: center; }
        button.action-btn { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button.action-btn:hover { background: #45a049; }

        .result-card { padding: 12px; border-radius: 6px; background: #2e2e2e; margin-top: 10px; border-left: 4px solid #00BFFF; }
        .score-display { font-size: 20px; font-weight: bold; margin: 6px 0; }
        .final-rank { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #000; margin-bottom: 8px; }
        .advice-item { display: block; font-size: 12px; color: #ccc; margin-top: 4px; }

        @media (max-width: 900px) {
            .app-container { flex-direction: column-reverse; height: auto; }
            .sidebar { width: 100%; height: auto; }
            .viewport-3d { height: 60vh; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div>
            <h2>夢想音樂節 - 3D 坐席視野</h2>
            <div class="subtitle">真實觀眾人海・器材全佈景・大螢幕轉播</div>
        </div>

        <div class="box">
            <div class="input-group">
                <label>觀看姿勢</label>
                <select id="postureSelect" onchange="applySeatView()">
                    <option value="sit" selected>🪑 坐姿 (預設椅高)</option>
                    <option value="stand">🧍 站姿 (站立嗨唱)</option>
                </select>
            </div>
            <div class="input-group">
                <label>身高校正</label>
                <div>
                    <input type="number" id="viewerHeight" value="165" min="130" max="210"> cm
                </div>
            </div>
            <div class="input-group">
                <label>排法模式</label>
                <select id="layoutSelect" onchange="buildSeatCloud()">
                    <option value="10x10" selected>10x10 排法 (有中走道)</option>
                    <option value="decreasing">遞減排法</option>
                </select>
            </div>
            <div class="input-group">
                <label>查詢座位</label>
                <div>
                    第 <input type="number" id="rowA" value="8" min="1" max="43"> 排
                    <input type="number" id="seatA" value="51" min="1" max="108"> 號
                </div>
            </div>

            <button class="action-btn" onclick="applySeatView()">進入該座位視野</button>
        </div>

        <div id="resultBox" class="result-card" style="display: none;"></div>
        
        <div style="font-size: 12px; color: #777; line-height: 1.5;">
            💡 視野特點：
            1. 坐在第 1 排時眼前完全無觀眾。<br>
            2. 坐在後排時，會完整顯示<b>所有前方排數</b>的觀眾席人海與後腦勺。<br>
            3. 滑鼠拖曳可自由旋轉視角環視全場。
        </div>
    </div>

    <div class="viewport-3d" id="viewport">
        <canvas id="canvas3d"></canvas>
        <div class="hud-overlay" id="hudInfo">
            目前視角：全場俯瞰預覽<br>
            請於左側輸入座位排號並點擊切換
        </div>
        <div class="fov-toggle">
            <button class="fov-btn" onclick="setFOV(70)">1× 主鏡頭</button>
            <button class="fov-btn" onclick="setFOV(95)">0.5× 超廣角</button>
            <button class="fov-btn" onclick="resetToOverview()">全場俯瞰</button>
        </div>
    </div>
</div>

<script>
    const totalRows = 43;
    let scene, camera, renderer, controls;
    let seatInstancedMesh = null;
    let audienceHeadMesh = null;
    let audienceBodyMesh = null;
    let stageTarget = new THREE.Vector3(0, 3.2, -2); // 偶像視線焦點

    let idolGroup; 
    let sideScreenTexture, screenCanvas, screenCtx;

    // 空間座標系統
    function calculateCoordinates(r, s, layout) {
        let v_aisles = layout === 'decreasing' ? [15, 29, 42, 66, 79, 93] : [4, 14, 24, 34, 44, 64, 74, 84, 94, 104];
        
        // Z 軸深度：第 1 排距離舞台 5.2 米
        let z = 5.2 + (r - 1) * 0.9;
        if (r > 10) z += 1.8;
        if (r > 20) z += 1.8;
        if (r > 24) z += 3.0; // 兩區交界橫走道
        if (r > 34) z += 1.8;

        let x = 0;
        if (s <= 54) {
            for (let i = s; i < 54; i++) { x += 0.52; if (v_aisles.includes(i)) x += 1.2; }
            x += 0.3;
            x = -x;
        } else {
            for (let i = 55; i < s; i++) { x += 0.52; if (v_aisles.includes(i)) x += 1.2; }
            x += 0.3;
        }

        let y = (r - 1) * 0.08; // 階梯坡度
        return { x, y, z };
    }

    function evaluateSeat(r, s, coords) {
        let distance = Math.sqrt(coords.x * coords.x + (coords.z - (-2)) * (coords.z - (-2)));
        let angle = Math.atan(Math.abs(coords.x) / (coords.z - (-2))) * (180 / Math.PI);
        let isMainStage = (s >= 40 && s <= 69);

        let scoreDist = Math.max(0, 100 - (distance / 50) * 60); 
        let scoreAngle = Math.max(0, 100 - (angle / 60) * 55);
        if (isMainStage) scoreAngle = Math.min(100, scoreAngle + 12);

        let final100 = Math.round((Math.min(scoreDist, scoreAngle) * 0.7) + (Math.max(scoreDist, scoreAngle) * 0.3));
        final100 = Math.min(100, Math.max(0, final100));

        let finalRank = "S 級【優質視野】"; let rankColor = "#1E90FF";
        if (final100 >= 85) { finalRank = "SSS 級【天選神位】"; rankColor = "#FFD700"; }
        else if (final100 >= 75) { finalRank = "SS 級【完美沉浸】"; rankColor = "#FF8C00"; }
        else if (final100 < 55) { finalRank = "B 級【輔助出動】"; rankColor = "#9370DB"; }

        return { distance, angle, final100, finalRank, rankColor };
    }

    function init3D() {
        const container = document.getElementById('viewport');
        const canvas = document.getElementById('canvas3d');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.FogExp2(0x0a0a0f, 0.010);

        camera = new THREE.PerspectiveCamera(65, container.clientWidth / container.clientHeight, 0.1, 200);
        camera.position.set(0, 22, 52);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.copy(stageTarget);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        buildEnvironment();
        buildSeatCloud();

        window.addEventListener('resize', onWindowResize);
        animate(0);
    }

    // 建置平行舞台與所有專業器材
    function buildEnvironment() {
        // 地面
        const floorGeo = new THREE.PlaneGeometry(160, 160);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 1. 平行一字主舞台 (無凸出延伸台，前沿在 z = 0)
        const stageMat = new THREE.MeshStandardMaterial({ color: 0x1f1f24, roughness: 0.5 });
        const flatStage = new THREE.Mesh(new THREE.BoxGeometry(50, 1.8, 8), stageMat);
        flatStage.position.set(0, 0.9, -4);
        scene.add(flatStage);

        // 2. 舞台前沿低音喇叭組 (Subwoofer Array)
        const subGeo = new THREE.BoxGeometry(1.2, 0.7, 0.8);
        const subMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.8 });
        for (let x = -20; x <= 20; x += 3.2) {
            const sub = new THREE.Mesh(subGeo, subMat);
            sub.position.set(x, 2.15, -0.4);
            scene.add(sub);
        }

        // 3. 舞台前緣鐵馬護欄 (Crowd Barrier) - 位於第 1 排前方的走道區
        const barrierGeo = new THREE.BoxGeometry(48, 1.1, 0.05);
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0x333338, metalness: 0.8 });
        const barrier = new THREE.Mesh(barrierGeo, barrierMat);
        barrier.position.set(0, 0.55, 3.2);
        scene.add(barrier);

        // 4. 中央斜頂主頂棚 (鋼架 Truss + 斜頂帆布)
        const trussMat = new THREE.MeshStandardMaterial({ color: 0x555562, metalness: 0.7, roughness: 0.3 });
        const roofGeo = new THREE.CylinderGeometry(13, 13, 10, 3, 1, false);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.6 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.rotation.x = Math.PI / 2;
        roof.rotation.z = Math.PI;
        roof.scale.set(1, 0.45, 1);
        roof.position.set(0, 12.2, -4);
        scene.add(roof);

        // 鋼架支柱
        const pGeo = new THREE.BoxGeometry(0.8, 11, 0.8);
        [[-9.5, -0.5], [9.5, -0.5], [-9.5, -7.5], [9.5, -7.5]].forEach(pos => {
            const p = new THREE.Mesh(pGeo, trussMat);
            p.position.set(pos[0], 6.5, pos[1]);
            scene.add(p);
        });

        // 5. 兩側鋼架懸吊 J 型線性陣列喇叭 (Line Array PA Towers)
        const lineArrayGeo = new THREE.BoxGeometry(0.7, 0.35, 0.5);
        const paMat = new THREE.MeshStandardMaterial({ color: 0x08080a });
        [-10.5, 10.5].forEach(xPos => {
            const paGroup = new THREE.Group();
            for (let i = 0; i < 9; i++) {
                const box = new THREE.Mesh(lineArrayGeo, paMat);
                box.position.set(0, -i * 0.42, Math.pow(i * 0.08, 1.4) * 0.3);
                box.rotation.x = (i * 0.04);
                paGroup.add(box);
            }
            paGroup.position.set(xPos, 9.5, -0.2);
            scene.add(paGroup);
        });

        // 6. 頂部面光燈橫樑 (Lighting Truss Rig)
        const lightBarGeo = new THREE.CylinderGeometry(0.12, 0.12, 18);
        const lightBar = new THREE.Mesh(lightBarGeo, trussMat);
        lightBar.rotation.z = Math.PI / 2;
        lightBar.position.set(0, 9.2, -0.2);
        scene.add(lightBar);

        const spotLightGeo = new THREE.SphereGeometry(0.18, 8, 8);
        const lightBulbMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let lx = -8; lx <= 8; lx += 1.6) {
            const bulb = new THREE.Mesh(spotLightGeo, lightBulbMat);
            bulb.position.set(lx, 9.0, -0.2);
            scene.add(bulb);
        }

        // 7. 兩側巨型直立轉播大螢幕
        screenCanvas = document.createElement('canvas');
        screenCanvas.width = 384;
        screenCanvas.height = 640;
        screenCtx = screenCanvas.getContext('2d');
        sideScreenTexture = new THREE.CanvasTexture(screenCanvas);

        const liveScreenMat = new THREE.MeshBasicMaterial({ map: sideScreenTexture });
        const sideScreenGeo = new THREE.PlaneGeometry(6, 9.5);

        const screenL1 = new THREE.Mesh(sideScreenGeo, liveScreenMat);
        screenL1.position.set(-20, 6.8, -3.5);
        scene.add(screenL1);

        const screenL2 = new THREE.Mesh(sideScreenGeo, liveScreenMat);
        screenL2.position.set(-13.5, 6.8, -3.5);
        scene.add(screenL2);

        const screenR1 = new THREE.Mesh(sideScreenGeo, liveScreenMat);
        screenR1.position.set(13.5, 6.8, -3.5);
        scene.add(screenR1);

        const screenR2 = new THREE.Mesh(sideScreenGeo, liveScreenMat);
        screenR2.position.set(20, 6.8, -3.5);
        scene.add(screenR2);

        // 背景主 LED
        const bgScreenMat = new THREE.MeshBasicMaterial({ color: 0x1f003a });
        const mainScreen = new THREE.Mesh(new THREE.PlaneGeometry(18, 7.5), bgScreenMat);
        mainScreen.position.set(0, 5.6, -7.8);
        scene.add(mainScreen);

        // 8. 偶像 (Idol)
        idolGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.22, 0.28, 0.8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff2a6d, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.3;
        idolGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.16, 16, 16);
        const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xffdfd0 }));
        head.position.y = 1.85;
        idolGroup.add(head);

        const hairGeo = new THREE.SphereGeometry(0.18, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const hair = new THREE.Mesh(hairGeo, new THREE.MeshStandardMaterial({ color: 0x1f140e }));
        hair.position.y = 1.92;
        idolGroup.add(hair);

        const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.9, 12);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const legL = new THREE.Mesh(legGeo, legMat);
        legL.position.set(-0.12, 0.45, 0);
        const legR = new THREE.Mesh(legGeo, legMat);
        legR.position.set(0.12, 0.45, 0);
        idolGroup.add(legL);
        idolGroup.add(legR);

        idolGroup.position.set(0, 1.8, -1.8);
        scene.add(idolGroup);

        const idolSpot = new THREE.SpotLight(0xffffff, 4, 30, Math.PI / 5, 0.25);
        idolSpot.position.set(0, 11, 2);
        idolSpot.target = idolGroup;
        scene.add(idolSpot);
    }

    // 全座位渲染 (每一排每一號都有椅子)
    function buildSeatCloud() {
        if (seatInstancedMesh) scene.remove(seatInstancedMesh);

        const layout = document.getElementById('layoutSelect').value;
        const seatGeo = new THREE.BoxGeometry(0.42, 0.35, 0.42);
        const seatMat = new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.6 });

        const totalCount = totalRows * (94 - 15 + 1);
        seatInstancedMesh = new THREE.InstancedMesh(seatGeo, seatMat, totalCount);
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        let idx = 0;
        for (let r = 1; r <= totalRows; r++) {
            for (let s = 15; s <= 94; s++) {
                const coords = calculateCoordinates(r, s, layout);
                dummy.position.set(coords.x, coords.y + 0.18, coords.z);
                dummy.updateMatrix();
                seatInstancedMesh.setMatrixAt(idx, dummy.matrix);

                if ((s >= 15 && s <= 20) || (s >= 89 && s <= 94)) {
                    color.setHex(0xffb3ba);
                } else {
                    color.setHex(r <= 24 ? 0x6e768e : 0x4d5366);
                }
                seatInstancedMesh.setColorAt(idx, color);
                idx++;
            }
        }

        seatInstancedMesh.instanceMatrix.needsUpdate = true;
        if (seatInstancedMesh.instanceColor) seatInstancedMesh.instanceColor.needsUpdate = true;
        scene.add(seatInstancedMesh);
    }

    // 前方觀眾群邏輯：
    // 若坐在第 1 排，前方無人影。
    // 若坐在第 r 排 (r > 1)，則完整生成從第 1 排一路到第 r - 1 排的所有觀眾人海！
    function updateFrontAudience(currentR, currentS, layout) {
        if (audienceHeadMesh) scene.remove(audienceHeadMesh);
        if (audienceBodyMesh) scene.remove(audienceBodyMesh);
        audienceHeadMesh = null;
        audienceBodyMesh = null;

        // 第 1 排前面是舞台與走道，眼前完全沒有任何人影
        if (currentR <= 1) {
            return;
        }

        // 計算前方視野內的所有觀眾數量
        // 前方排數為 1 ~ currentR - 1
        const rowsInFront = currentR - 1;
        // 為了極致流暢度，視角主要涵蓋當前座位左右兩側各 12 個座位的視野椎體
        const minS = Math.max(15, currentS - 14);
        const maxS = Math.min(94, currentS + 14);
        const seatsPerSpan = (maxS - minS + 1);
        const totalAudience = rowsInFront * seatsPerSpan;

        if (totalAudience <= 0) return;

        // 使用 InstancedMesh 高效能渲染上千位前方觀眾
        const headGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.7 });
        audienceHeadMesh = new THREE.InstancedMesh(headGeo, hairMat, totalAudience);

        const bodyGeo = new THREE.CylinderGeometry(0.14, 0.17, 0.48, 12);
        const clothMat = new THREE.MeshStandardMaterial({ color: 0xd2d5dd, roughness: 0.6 });
        audienceBodyMesh = new THREE.InstancedMesh(bodyGeo, clothMat, totalAudience);

        const dummyHead = new THREE.Object3D();
        const dummyBody = new THREE.Object3D();

        let idx = 0;
        for (let r = 1; r < currentR; r++) {
            for (let s = minS; s <= maxS; s++) {
                const coords = calculateCoordinates(r, s, layout);
                
                // 坐姿觀眾人頭高度 (約椅高 0.42m + 上半身頭部位置)
                dummyHead.position.set(coords.x, coords.y + 0.98, coords.z);
                dummyHead.updateMatrix();
                audienceHeadMesh.setMatrixAt(idx, dummyHead.matrix);

                dummyBody.position.set(coords.x, coords.y + 0.68, coords.z);
                dummyBody.updateMatrix();
                audienceBodyMesh.setMatrixAt(idx, dummyBody.matrix);

                idx++;
            }
        }

        audienceHeadMesh.instanceMatrix.needsUpdate = true;
        audienceBodyMesh.instanceMatrix.needsUpdate = true;

        scene.add(audienceHeadMesh);
        scene.add(audienceBodyMesh);
    }

    // 繪製直立螢幕轉播
    function renderLiveScreen(time) {
        if (!screenCtx) return;

        const gradient = screenCtx.createLinearGradient(0, 0, 0, 640);
        gradient.addColorStop(0, '#0a0020');
        gradient.addColorStop(0.5, '#2e0050');
        gradient.addColorStop(1, '#050014');
        screenCtx.fillStyle = gradient;
        screenCtx.fillRect(0, 0, 384, 640);

        screenCtx.beginPath();
        screenCtx.arc(192, 300, 140 + Math.sin(time * 3) * 8, 0, Math.PI * 2);
        screenCtx.fillStyle = 'rgba(255, 42, 109, 0.25)';
        screenCtx.fill();

        // 偶像特寫
        screenCtx.fillStyle = '#ffdfd0';
        screenCtx.beginPath();
        screenCtx.arc(192, 230 + Math.sin(time * 2) * 5, 55, 0, Math.PI * 2);
        screenCtx.fill();

        screenCtx.fillStyle = '#1f140e';
        screenCtx.beginPath();
        screenCtx.arc(192, 215 + Math.sin(time * 2) * 5, 60, Math.PI, Math.PI * 2);
        screenCtx.fill();

        screenCtx.fillStyle = '#ff2a6d';
        screenCtx.beginPath();
        screenCtx.moveTo(110, 640);
        screenCtx.lineTo(150, 290);
        screenCtx.lineTo(234, 290);
        screenCtx.lineTo(274, 640);
        screenCtx.closePath();
        screenCtx.fill();

        screenCtx.fillStyle = '#ff0033';
        screenCtx.beginPath();
        screenCtx.arc(35, 45, 8, 0, Math.PI * 2);
        screenCtx.fill();

        screenCtx.fillStyle = '#ffffff';
        screenCtx.font = 'bold 20px Arial';
        screenCtx.fillText('LIVE  IMAG', 52, 52);

        screenCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        screenCtx.lineWidth = 2;
        for (let i = 0; i < 640; i += 8) {
            screenCtx.beginPath();
            screenCtx.moveTo(0, i);
            screenCtx.lineTo(384, i);
            screenCtx.stroke();
        }

        sideScreenTexture.needsUpdate = true;
    }

    // 進入座位視角
    function applySeatView() {
        const r = parseInt(document.getElementById('rowA').value);
        const s = parseInt(document.getElementById('seatA').value);
        const heightCm = parseFloat(document.getElementById('viewerHeight').value) || 165;
        const posture = document.getElementById('postureSelect').value;

        // 坐姿眼高計算
        let eyeHeight = posture === 'sit' ? (0.42 + (heightCm * 0.45 / 100)) : (heightCm * 0.93 / 100);

        if (r < 1 || r > totalRows || s < 1 || s > 108) {
            alert('請輸入有效範圍內的座位 (排: 1~43, 號: 1~108)');
            return;
        }

        const layout = document.getElementById('layoutSelect').value;
        const coords = calculateCoordinates(r, s, layout);
        const stats = evaluateSeat(r, s, coords);

        camera.position.set(coords.x, coords.y + eyeHeight, coords.z);
        controls.target.copy(stageTarget);
        controls.update();

        // 完整更新前方所有排數的觀眾海
        updateFrontAudience(r, s, layout);

        document.getElementById('hudInfo').innerHTML = `
            <b>第 ${r} 排 ${s} 號</b> (${posture === 'sit' ? '坐姿' : '站姿'}視角)<br>
            舞台距離：${stats.distance.toFixed(1)} m ｜ 視角偏角：${stats.angle.toFixed(1)}°<br>
            離地眼高：${(coords.y + eyeHeight).toFixed(2)} m ${r === 1 ? '<b>(第一排無遮擋)</b>' : `(前方有 ${r - 1} 排觀眾)`}
        `;

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `
            <div style="font-size: 15px; font-weight: bold;">第 ${r} 排 ${s} 號 · 視野診斷</div>
            <div class="score-display" style="color: #00BFFF;">視野分數：${stats.final100} 分</div>
            <span class="final-rank" style="background:${stats.rankColor};">${stats.finalRank}</span>
            <span class="advice-item">📐 舞台直線距離：<b>${stats.distance.toFixed(1)}m</b></span>
            <span class="advice-item">🪑 視點高度：<b>${(coords.y + eyeHeight).toFixed(2)}m</b> (已計入椅面高度)</span>
            <span class="advice-item">👁️ 水平偏角：<b>${stats.angle.toFixed(1)}°</b></span>
        `;
    }

    function setFOV(fovVal) {
        camera.fov = fovVal;
        camera.updateProjectionMatrix();
    }

    function resetToOverview() {
        if (audienceHeadMesh) scene.remove(audienceHeadMesh);
        if (audienceBodyMesh) scene.remove(audienceBodyMesh);
        audienceHeadMesh = null;
        audienceBodyMesh = null;

        camera.position.set(0, 22, 52);
        camera.fov = 65;
        camera.updateProjectionMatrix();
        controls.target.copy(stageTarget);
        controls.update();
        document.getElementById('hudInfo').innerHTML = `目前視角：全場俯瞰預覽`;
    }

    function onWindowResize() {
        const container = document.getElementById('viewport');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate(currentTime) {
        requestAnimationFrame(animate);

        const time = currentTime * 0.001;

        if (idolGroup) {
            idolGroup.position.y = 1.8 + Math.sin(time * 2.5) * 0.02;
            idolGroup.rotation.y = Math.sin(time * 1.2) * 0.12;
        }

        renderLiveScreen(time);

        controls.update();
        renderer.render(scene, camera);
    }

    window.onload = init3D;
</script>
</body>
</html>
